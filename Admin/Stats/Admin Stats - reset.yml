info:
  name: Admin Stats - reset
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/admin/v1/game-stats/:statId/player-stats"
  params:
    - name: statId
      value: "{{statId}}"
      type: path
    - name: mode
      value: all
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Reset the player stats for a stat.

  **Authentication**
  - Required scope: `write:stats`.

  **Path**
  - `{{statId}}` - The ID of the stat.

  **Query**
  - `mode` (optional, default `all`) - Which players to reset: `all`, `live` or `dev`.