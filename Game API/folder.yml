docs:
  content: |
    The **Game API** is the gameplay-orientated API, which authenticates requests on behalf of players. These routes (e.g. `Players`, `Stats`, `Leaderboards`) use the standard game API key: `{{apiKey}}`.

    See the [HTTP API reference](https://docs.trytalo.com/http/authentication) for more details.
  type: text/markdown