info:
  name: Leaderboard - top entries
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/leaderboards/:leaderboardInternalName/entries/top"
  params:
    - name: leaderboardInternalName
      value: "{{leaderboardInternalName}}"
      type: path
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Get a leaderboard's top entries alongside the current player's entries, each with its global `position`. Returns up to `limit` entries in each list, in the leaderboard's sort order.

  **Authentication**
  - Required scope: `read:leaderboards`.
  - Authenticated by: `X-Talo-Alias`.

  **Path**
  - `{{leaderboardInternalName}}` - The internal name of the leaderboard.

  **Query**
  - `limit` (required) - The maximum number of entries to return in each list (max `200`).
