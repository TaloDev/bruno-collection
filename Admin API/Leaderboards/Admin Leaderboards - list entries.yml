info:
  name: Admin Leaderboards - list entries
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/v1/leaderboards/:leaderboardId/entries"
  params:
    - name: leaderboardId
      value: "{{leaderboardId}}"
      type: path
    - name: page
      value: "0"
      type: query
    - name: aliasId
      value: "{{aliasId}}"
      type: query
      disabled: true
    - name: withDeleted
      value: "0"
      type: query
      disabled: true
    - name: propKey
      value: ""
      type: query
      disabled: true
    - name: propValue
      value: ""
      type: query
      disabled: true
    - name: startDate
      value: ""
      type: query
      disabled: true
    - name: endDate
      value: ""
      type: query
      disabled: true
    - name: aliasService
      value: ""
      type: query
      disabled: true
    - name: playerId
      value: "{{playerId}}"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List a leaderboard's entries. 50 results are returned per page.

  **Authentication**
  - Required scope: `read:leaderboards`.

  **Path**
  - `{{leaderboardId}}` - The ID of the leaderboard.

  **Query**
  - `page` (optional, default `0`) - The current pagination index (starting at 0).
  - `aliasId` (optional) - Only return entries for this alias ID.
  - `withDeleted` (optional) - Include entries that were deleted by a refresh interval (`0` or `1`).
  - `propKey` (optional) - Only return entries with this prop key.
  - `propValue` (optional) - Only return entries with a matching prop key and value.
  - `startDate` (optional) - UTC date (YYYY-MM-DD), ISO 8601 datetime, or millisecond timestamp.
  - `endDate` (optional) - Same format as `startDate`.
  - `aliasService` (optional) - Only return entries for this player alias service (e.g. `steam`, `epic`, `username`).
  - `playerId` (optional) - Only return entries for this player ID.

  The `X-Talo-Include-Dev-Data` header (set to `1`) includes entries belonging to dev players.