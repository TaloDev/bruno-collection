info:
  name: Admin Leaderboards - reset
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/admin/v1/leaderboards/:leaderboardId/entries"
  params:
    - name: leaderboardId
      value: "{{leaderboardId}}"
      type: path
    - name: mode
      value: all
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Reset a leaderboard's entries. Optionally filtered to live or dev players.

  **Authentication**
  - Required scope: `write:leaderboards`.

  **Path**
  - `{{leaderboardId}}` - The ID of the leaderboard.

  **Query**
  - `mode` (optional, default `all`) - Which players to reset: `all`, `live` or `dev`.