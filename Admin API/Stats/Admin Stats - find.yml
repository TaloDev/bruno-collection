info:
  name: Admin Stats - find
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/v1/game-stats/:statId"
  params:
    - name: statId
      value: "{{statId}}"
      type: path
    - name: withMetrics
      value: "1"
      type: query
      disabled: true
    - name: metricsStartDate
      value: ""
      type: query
      disabled: true
    - name: metricsEndDate
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Find a game stat by ID.

  **Authentication**
  - Required scope: `read:stats`.

  **Path**
  - `{{statId}}` - The ID of the stat.

  **Query**
  - `withMetrics` (optional) - Set to `1` to include metrics for global stats.
  - `metricsStartDate` (optional) - UTC date (YYYY-MM-DD), ISO 8601 datetime, or millisecond timestamp.
  - `metricsEndDate` (optional) - Same format as `metricsStartDate`.

  The `X-Talo-Include-Dev-Data` header (set to `1`) includes dev data in the metrics.