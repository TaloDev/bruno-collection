info:
  name: Admin Game channels - list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/v1/game-channels"
  params:
    - name: search
      value: ""
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
      disabled: true
    - name: propKey
      value: ""
      type: query
      disabled: true
    - name: propValue
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List all game channels. 50 results are returned per page.

  **Authentication**
  - Required scope: `read:gameChannels`.

  **Query**
  - `search` (optional) - Search channels by name or owner.
  - `page` (optional, default `0`) - The current pagination index (starting at 0).
  - `propKey` (optional) - Only return channels with this prop key.
  - `propValue` (optional) - Only return channels with a matching prop key and value.

  The `X-Talo-Include-Dev-Data` header (set to `1`) includes dev players in member counts.
