info:
  name: Admin Events - list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/v1/events"
  params:
    - name: from
      value: "2026-08-01T00:00:00.000Z"
      type: query
    - name: to
      value: "2026-08-15T23:59:59.999Z"
      type: query
    - name: limit
      value: "2000"
      type: query
      disabled: true
    - name: includeProps
      value: "1"
      type: query
      disabled: true
    - name: cursor
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List events in a UTC date range, oldest first. Follow `nextCursor` until it is `null` to read the whole range.

  **Authentication**
  - Required scope: `read:events`.

  **Query**
  - `from` - Inclusive UTC start of the range (ISO 8601, YYYY-MM-DD or a millisecond timestamp).
  - `to` - Inclusive UTC end of the range. The window is at most 90 days.
  - `limit` (optional, default and maximum `2000`) - Events per page.
  - `includeProps` (optional) - Set to `1` to include event props (off by default).
  - `cursor` (optional) - The `nextCursor` from a previous page.

  The response's `events` is an array of `{ id, name, playerAliasId, devBuild, createdAt, props? }`.

  The `X-Talo-Include-Dev-Data` header (set to `1`) includes dev build events.
