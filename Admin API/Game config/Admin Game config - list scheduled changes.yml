info:
  name: Admin Game config - list scheduled changes
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/admin/v1/game-config/scheduled-changes"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List the scheduled live config changes for the game.

  **Authentication**
  - Required scope: `read:gameConfig`.

  The response's `changes` is an array of `{ id, key, value, applyAt, createdAt }`, ordered by `applyAt` ascending.