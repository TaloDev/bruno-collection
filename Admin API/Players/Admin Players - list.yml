info:
  name: Admin Players - list
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/v1/players"
  params:
    - name: search
      value: ""
      type: query
      disabled: true
    - name: page
      value: "0"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  List all players. 50 results are returned per page.

  **Authentication**
  - Required scope: `read:players`.

  **Query**
  - `search` (optional) - Search by IDs, prop values, alias identifiers, and display names.
  - `page` (optional, default `0`) - The current pagination index (starting at 0).

  The `X-Talo-Include-Dev-Data` header (set to `1`) includes dev players.
